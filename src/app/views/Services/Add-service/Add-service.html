<!-- add-business-type.component.html -->
<div class="card shadow-sm border-0 rounded-4">
  <div class="card-header bg-primary bg-gradient text-white rounded-top-4 py-3">
    <h5 class="mb-0">{{!serviceToEdit ? 'Add Service' : 'Edit Service'}}</h5>
  </div>

  <div class="card-body p-4">

    <!-- Description -->
    <div class="mb-4">
      <label for="description" class="form-label fw-semibold text-uppercase small text-muted">Description</label>
      <input type="text" class="form-control form-control-lg" id="description" [(ngModel)]="description"
        placeholder="Enter Country Name">
    </div>

    <!-- Service Type -->
    <div class="mb-4">
      <label class="form-label fw-semibold text-uppercase small text-muted d-block">Service Type</label>
      <div class="btn-group" role="group">
        <input type="radio" class="btn-check" name="visibility" id="public" value="public"
          [(ngModel)]="visibility" autocomplete="off">
        <label class="btn btn-outline-primary rounded-pill me-2" for="public">🌐 Public</label>

        <input type="radio" class="btn-check" name="visibility" id="local" value="local"
          [(ngModel)]="visibility" autocomplete="off">
        <label class="btn btn-outline-primary rounded-pill" for="local">📍 Local</label>
      </div>
    </div>

    <!-- Icon Picker -->
    <div class="mb-4">
      <div class="form-label fw-semibold text-uppercase small text-muted mb-2">Choose Icon</div>
      <div class="row row-cols-3 row-cols-sm-4 row-cols-md-5 g-2" style="max-height: 200px; overflow-y: auto;">
        <div class="col" *ngFor="let icon of icons">
          <div class="border rounded-3 p-2 text-center h-100" (click)="selectIcon(icon)" [ngClass]="{
              'border-success border-2 bg-success bg-opacity-10': selectedIcon === icon,
              'border-secondary-subtle': selectedIcon !== icon
            }" style="cursor: pointer;">
            <c-icon [name]="icon" size="l"></c-icon>
          </div>
        </div>
      </div>
    </div>

    <hr class="my-4">

    <!-- Activities -->
    <div class="mb-4">
      <label class="form-label fw-semibold text-uppercase small text-muted d-block">Activities</label>
      <div class="border rounded-3 p-3 " style="max-height: 130px; overflow-y: auto;">
        <div class="form-check mb-1" *ngFor="let act of activities">
          <input class="form-check-input" type="checkbox" [id]="'act-' + act.activity_id"
            [checked]="selectedActivityIds.includes(act.activity_id!)"
            (change)="toggleActivity(act.activity_id!, $event)" />
          <label class="form-check-label" [for]="'act-' + act.activity_id">
            {{ act.description }}
          </label>
        </div>
      </div>
    </div>

    <!-- Businesses -->
    <div class="mb-4">
      <label class="form-label fw-semibold text-uppercase small text-muted d-block">Businesses</label>
      <div class="border rounded-3 p-3 " style="max-height: 130px; overflow-y: auto;">
        <div class="form-check mb-1" *ngFor="let one of businesses">
          <input class="form-check-input" type="checkbox" [id]="'bus-' + one.business_id"
            [checked]="selectedBusinessIds.includes(one.business_id!)"
            (change)="toggleBusiness(one.business_id!, $event)" />
          <label class="form-check-label" [for]="'bus-' + one.business_id">
            {{ one.business_name }}
          </label>
        </div>
      </div>
    </div>

    <!-- Business Services Table -->
    <div *ngIf="businessServices.length > 0" class="mb-4">
      <label class="form-label fw-semibold text-uppercase small text-muted d-block mb-2">Consumer Settings</label>
      <div class="table-responsive rounded-3 border">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Business</th>
              <th class="text-center">Is Consumer?</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let bus of businessServices">
              <td>{{ getBusinessName(bus.business_id) }}</td>
              <td class="text-center">
                <div class="form-check form-switch d-flex justify-content-center">
                  <input class="form-check-input" type="checkbox" role="switch"
                    [checked]="bus.is_Consumer"
                    (change)="onConsumerChanged(bus)" />
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <button [disabled]="loading" class="btn btn-primary btn-lg w-100 rounded-3" (click)="addService()">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
      {{!serviceToEdit ? 'Add Service' : 'Save Changes'}}
    </button>

    <div *ngIf="message" class="alert alert-info mt-3 rounded-3">{{ message }}</div>
  </div>
</div>
