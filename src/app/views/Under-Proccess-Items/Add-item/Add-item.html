<!-- Add-item.html -->
<div class="card">
  <div class="card-header row justify-content-between align-items-center col-md-12 mx-1">
    <p class="col-md-2 mb-0">{{ isEditMode ? 'Edit item' : 'Add new item' }}</p>
    <p *ngIf="message" class="alert alert-info col-md-6 mb-0">{{ message }}</p>
  </div>

  <div class="card-body">
    <div class="row g-3">

      <!-- Description -->
      <div class="col-md-6">
        <label class="form-label text-danger">Item Description<span style="font-size: 18px;" class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="ItemDescription" placeholder="Enter description">
      </div>

      <!-- Details -->
      <div class="col-md-6">
        <label class="form-label text-danger">Item Details<span class="text-danger" style="font-size: 18px;">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="ItemDetails" placeholder="Enter details">
      </div>

      <!-- SKU -->
      <div class="col-md-3">
        <label class="form-label text-danger">SKU<span class="text-danger" style="font-size: 18px;">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="sku" placeholder="Enter SKU">
      </div>

      <!-- UPC -->
      <div class="col-md-3">
        <label class="form-label text-danger">UPC<span class="text-danger" style="font-size: 18px;">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="upc" placeholder="Enter UPC">
      </div>

      <!-- Internet Id -->
      <div class="col-md-3">
        <label class="form-label">Internet Id</label>
        <input type="text" class="form-control" [(ngModel)]="InternetId" placeholder="Enter Internet Id">
      </div>

      <!-- Model -->
      <div class="col-md-3">
        <label class="form-label">Model</label>
        <input type="text" class="form-control" [(ngModel)]="Model" placeholder="Enter model">
      </div>

      <!-- Platform -->
      <div class="col-md-3">
        <label class="form-label">Platform</label>
        <select class="form-select" [(ngModel)]="PlatformId">
          <option disabled [ngValue]="null">-- Select Platform --</option>
          <option *ngFor="let one of Platforms" [ngValue]="one.platform_id">
            {{ one.description }}
          </option>
        </select>
      </div>

      <!-- Brand -->
      <div class="col-md-3">
        <label class="form-label">Brand</label>
        <select class="form-select" [(ngModel)]="BrandId">
          <option disabled [ngValue]="null">-- Select Brand --</option>
          <option *ngFor="let one of Brands" [ngValue]="one.carBrandId">
            {{ one.carBrandName }}
          </option>
        </select>
      </div>

      <!-- Category -->
      <div class="col-md-3">
        <label class="form-label text-danger">Category<span class="text-danger" style="font-size: 18px;">*</span></label>
        <select class="form-select" [(ngModel)]="CategoryId">
          <option disabled [ngValue]="null">-- Select Category --</option>
          <option *ngFor="let one of Categories" [ngValue]="one.category_id">
            {{ one.name }}
          </option>
        </select>
      </div>

      <!-- Size -->
      <div class="col-md-3">
        <label class="form-label">Size</label>
        <select class="form-select" [(ngModel)]="SizeId">
          <option disabled [ngValue]="null">-- Select Size --</option>
          <option *ngFor="let one of Sizes" [ngValue]="one.size_id">
            {{ one.description }}
          </option>
        </select>
      </div>

      <!-- Unit -->
      <div class="col-md-3">
        <label class="form-label">Unit</label>
        <select class="form-select" [(ngModel)]="UnitId">
          <option disabled [ngValue]="null">-- Select Unit --</option>
          <option *ngFor="let one of Units" [ngValue]="one.unit_id">
            {{ one.description }}
          </option>
        </select>
      </div>

      <!-- Color -->
      <div class="col-md-3">
        <label class="form-label">Color</label>
        <select class="form-select" [(ngModel)]="ColorId">
          <option disabled [ngValue]="null">-- Select Color --</option>
          <option *ngFor="let one of Colors" [ngValue]="one.color_id">
            {{ one.description }}
          </option>
        </select>
      </div>

      <!-- Currency -->
      <div class="col-md-3">
        <label class="form-label">Currency</label>
        <select class="form-select" [(ngModel)]="CurrencyId">
          <option disabled [ngValue]="null">-- Select Currency --</option>
          <option *ngFor="let one of Currencies" [ngValue]="one.currencyId">
            {{ one.code }}
          </option>
        </select>
      </div>

      <!-- Base Price -->
      <div class="col-md-3">
        <label class="form-label text-danger">Base Price<span class="text-danger">*</span></label>
        <input type="number" step="0.01" class="form-control" [(ngModel)]="BasePrice" placeholder="0.00">
      </div>

      <!-- Unit Value -->
      <div class="col-md-3">
        <label class="form-label">Unit Value</label>
        <input type="number" step="0.01" class="form-control" [(ngModel)]="UnitValue" placeholder="0.00">
      </div>

      <!-- Dimensions -->
      <div class="col-md-3">
        <label class="form-label">Height</label>
        <input type="number" step="0.01" class="form-control" [(ngModel)]="Height" placeholder="0.00">
      </div>

      <div class="col-md-3">
        <label class="form-label">Width</label>
        <input type="number" step="0.01" class="form-control" [(ngModel)]="Width" placeholder="0.00">
      </div>

      <div class="col-md-3">
        <label class="form-label">Length</label>
        <input type="number" step="0.01" class="form-control" [(ngModel)]="Length" placeholder="0.00">
      </div>

      <!-- Current Images (Edit mode only) -->
      <div class="col-md-9" *ngIf="isEditMode && existingImages.length > 0">
        <label class="form-label">Current Images</label>
        <div class="d-flex flex-wrap gap-2 border rounded p-3 bg-body-tertiary">
          <div class="position-relative" style="width: 90px;" *ngFor="let img of existingImages">
            <img [src]="img.imageUrl" class="rounded border w-100" style="height: 90px; object-fit: cover;" />
            <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 rounded-circle"
              style="width: 22px; height: 22px; padding: 0; line-height: 1; font-size: 12px; transform: translate(30%, -30%);"
              (click)="removeExistingImage(img)">
              ✕
            </button>
          </div>
        </div>
      </div>

      <!-- Images (new uploads) -->
      <div class="col-md-9">
        <label class="form-label">{{ isEditMode ? 'Add More Images' : 'Images' }}</label>

        <div class="border rounded p-3 bg-body-tertiary">
          <input #fileInput type="file" accept="image/*" multiple class="d-none" (change)="onFilesSelected($event)" />

          <div class="d-flex align-items-center justify-content-between mb-2">
            <button type="button" class="btn btn-outline-secondary btn-sm text-danger"  (click)="fileInput.click()">
              <svg cIcon name="cilCloudUpload" class="me-1"></svg>
              Select Images<span class="text-danger"  style="font-size: 18px;">*</span>
            </button>
            <span class="text-muted small" *ngIf="selectedImages.length > 0">
              {{ selectedImages.length }} image{{ selectedImages.length > 1 ? 's' : '' }} selected
            </span>
          </div>

          <div *ngIf="selectedImages.length === 0" class="text-center text-muted small py-3">
            <svg cIcon name="cilImage" size="lg" class="d-block mx-auto mb-1 opacity-50"></svg>
            No images selected yet
          </div>

          <div class="d-flex flex-wrap gap-2" *ngIf="selectedImages.length > 0">
            <div class="position-relative" style="width: 90px;" *ngFor="let img of selectedImages; let i = index">
              <img [src]="img.previewUrl" class="rounded border w-100" style="height: 90px; object-fit: cover;" />
              <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 rounded-circle"
                style="width: 22px; height: 22px; padding: 0; line-height: 1; font-size: 12px; transform: translate(30%, -30%);"
                (click)="removeImageField(i)">
                ✕
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <hr class="my-4" />

    <button [disabled]="loading" class="btn btn-primary" (click)="isEditMode ? UpdateItem() : AddItem()">
      {{ loading ? 'Saving...' : (isEditMode ? 'Update Item' : 'Add To Inventory') }}
    </button>
  </div>
</div>
