<div class="container-fluid py-4" >
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">

      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

        <!-- Header بتدرج لوني -->
        <div class="card-header border-0 py-4 px-4"
             style="background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);">
          <div class="d-flex align-items-center gap-3">
            <div class="bg-white bg-opacity-25 rounded-3 d-flex align-items-center justify-content-center"
                 style="width: 48px; height: 48px;">
              <i class="fas fa-truck-fast text-white fs-4"></i>
            </div>
            <div>
              <h4 class="text-white mb-0 fw-bold">إضافة تكلفة شحن</h4>
              <small class="text-white-50">حدد شركة الشحن ووحدة الوزن والتكلفة</small>
            </div>
          </div>
        </div>

        <div class="card-body p-4 p-md-5">

          <!-- رسالة تنبيه -->
          <div *ngIf="message"
               class="alert rounded-3 border-0 mb-4"
               [ngClass]="message.includes('✅') ? 'alert-success' : 'alert-danger'">
            {{ message }}
          </div>

          <form (ngSubmit)="submit()" #shippingForm="ngForm">
            <div class="row g-4">
              <!-- Logistic Dropdown -->
              <div class="col-md-6">
                <label class="form-label fw-semibold text-secondary small text-uppercase">
                  شركة الشحن
                </label>
                <select
                  class="form-select form-select-lg rounded-3 border-2"
                  [(ngModel)]="model.logisticId"
                  name="logisticId"
                  required>
                  <option [ngValue]="null" disabled>اختر شركة الشحن</option>
                  <option *ngFor="let l of logistics" [ngValue]="l.logisticId">
                    شركة #{{ l.logisticId }} {{ l.business ? '(' + l.business.business_name + ')' : '' }}
                  </option>
                </select>
              </div>

              <!-- Weight Unit Dropdown -->
              <div class="col-md-6">
                <label class="form-label fw-semibold text-secondary small text-uppercase">
                  وحدة الوزن
                </label>
                <select
                  class="form-select form-select-lg rounded-3 border-2"
                  [(ngModel)]="model.weight_UnitId"
                  name="weightUnitId"
                  required>
                  <option [ngValue]="null" disabled>اختر وحدة الوزن</option>
                  <option *ngFor="let w of weightUnits" [ngValue]="w.weight_UnitId">
                    {{ w.description }}
                  </option>
                </select>
              </div>

              <!-- Weight Value -->
              <div class="col-md-4">
                <label class="form-label fw-semibold text-secondary small text-uppercase">
                  قيمة الوزن
                </label>
                <div class="input-group input-group-lg">
                  <input
                    type="number"
                    class="form-control rounded-start-3"
                    [(ngModel)]="model.weight_Value"
                    name="weightValue"
                    placeholder="0.0"
                    step="0.01"
                    required />
                  <span class="input-group-text bg-light rounded-end-3 border-2">وحدة</span>
                </div>
              </div>

              <!-- Cost Amount -->
              <div class="col-md-4">
                <label class="form-label fw-semibold text-secondary small text-uppercase">
                  التكلفة (Cost)
                </label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text bg-light rounded-start-3 border-2">£</span>
                  <input
                    type="number"
                    class="form-control rounded-end-3"
                    [(ngModel)]="model.costAmount"
                    name="costAmount"
                    placeholder="0.00"
                    step="0.01"
                    required />
                </div>
              </div>

              <!-- Sale Amount -->
              <div class="col-md-4">
                <label class="form-label fw-semibold text-secondary small text-uppercase">
                  سعر البيع (Sale)
                </label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text bg-light rounded-start-3 border-2">£</span>
                  <input
                    type="number"
                    class="form-control rounded-end-3"
                    [(ngModel)]="model.saleAmount"
                    name="saleAmount"
                    placeholder="0.00"
                    step="0.01"
                    required />
                </div>
              </div>

            </div>

            <!-- زر الإرسال -->
            <div class="d-flex justify-content-end gap-3 mt-5">
              <button
                type="button"
                class="btn btn-outline-secondary btn-lg rounded-3 px-4"
                routerLink="/Home/shipping-costs">
                إلغاء
              </button>
              <button
                type="submit"
                class="btn btn-lg rounded-3 px-5 text-white fw-semibold"
                style="background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);"
                [disabled]="loading || shippingForm.invalid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isUpdate ? (loading ? 'جارٍ الحفظ...' : 'حفظ') : (loading ? 'جارٍ الإضافة...' : 'إضافة') }}
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
