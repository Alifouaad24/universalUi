<div class="card">
  <div class="card-header">
    Shipping Types List
  </div>
  <div class="card-body">
    <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center" style="height: 150px;">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    <div *ngIf="!isLoading && message" class="alert alert-danger">{{ message }}</div>
    <div *ngIf="GlobalShippingTypes.length > 0" class="row">
      <div *ngFor="let type of GlobalShippingTypes" class="col-md-4 mb-3">
        <div class="card h-100 shadow-sm cursor-pointer" routerLink="./shipping-costs" [queryParams]="{ shippingTypeId: type.shippingTypeId }">
          <div class="card-body">
            <h5 class="card-title">{{ type.name }} Shipping</h5>
            <!-- <div class="d-flex justify-content-end gap-2 mt-3">
              <button class="btn btn-sm btn-primary" [routerLink]="['./add-edit-finantial']"
                [queryParams]="{ finantial: type | json }">
                <c-icon name="cil-pencil"></c-icon>
              </button>

              <button class="btn btn-sm btn-danger" (click)="confirmDelete(type)">
                <c-icon name="cil-trash"></c-icon>
              </button>
            </div> -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<c-modal [(visible)]="showDeleteModal" [size]="'sm'">
  <c-modal-header>Confirm Delete</c-modal-header>
  <c-modal-body>
    Are you sure you want to delete {{ selectedType?.name }}?
  </c-modal-body>
  <c-modal-footer>
    <button class="btn btn-secondary" (click)="showDeleteModal = false">Cancel</button>
    <button class="btn btn-danger" (click)="deleteFinantial(selectedType)">Delete</button>
  </c-modal-footer>
</c-modal>

<!-- Toaster -->
<c-toaster placement="top-end" class="p-3">
  <c-toast (timer)="onTimerChange($event)" (visibleChange)="onVisibleChange($event)" [visible]="toastVisible()"
    [autohide]="autoHideToast()" [delay]="3000">
    <c-toast-header>
      Delete!
    </c-toast-header>
    <c-toast-body>
      <p>{{ toastMessage() }}</p>
      <c-progress thin [value]="percentage()" />
    </c-toast-body>
  </c-toast>
</c-toaster>
