<!-- Add-Feature.html -->
<div class="card border-0 shadow-sm">
  <div class="card-header bg-primary bg-opacity-10 border-0 py-3">
    <h5 class="mb-0 fw-bold text-primary">
      <i class="fas fa-plus-circle me-2"></i>
      Add Task
    </h5>
  </div>

  <div class="card-body p-4">

    <!-- ================= Notes ================= -->
    <div class="mb-4">
      <label for="notes" class="form-label fw-semibold">
        <i class="fas fa-sticky-note text-muted me-1"></i>
        Notes
      </label>
      <textarea class="form-control" id="notes" rows="4" [(ngModel)]="notes" placeholder="Enter order notes"></textarea>
    </div>

    <hr class="my-4 text-secondary opacity-25" />

    <!-- ================= Status + Business ================= -->
    <div class="row g-3 mb-2">
      <div class="col-md-6">
        <label class="form-label fw-semibold">
          <i class="fas fa-flag text-muted me-1"></i>
          Status
        </label>
        <select class="form-select" [(ngModel)]="selectedOrderStatusId">
          <option disabled [ngValue]="null">-- Select Status --</option>
          <option *ngFor="let s of OrderStatuses" [ngValue]="s.orderStatusId">
            {{ s.statusEn }}
          </option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">
          <i class="fas fa-building text-muted me-1"></i>
          Business
        </label>
        <select class="form-select" (change)="getAllServices(selectedBusinessId)" [(ngModel)]="selectedBusinessId">
          <option disabled [ngValue]="null">-- Select Business --</option>
          <option *ngFor="let one of Businesses" [ngValue]="one.business_id">
            {{ one.business_name }}
          </option>
        </select>
      </div>
    </div>

    <hr class="my-4 text-secondary opacity-25" />

    <!-- ================= Assignee ================= -->
    <h6 class="fw-bold mb-3 text-secondary">
      <i class="fas fa-user-check me-2"></i>
      Assignee
    </h6>


    <div class="row g-3">
      <div class="col-md-6 mb-3">
        <label class="form-label">Assignee Type</label>
        <select class="form-select" [(ngModel)]="selectedAssigneeTypeId"
          (change)="onAssigneeTypeChange(selectedAssigneeTypeId)">
          <option disabled [ngValue]="null">-- Select Type --</option>
          <option *ngFor="let t of assignTypes" [ngValue]="t.assign_typeId">{{ t.type }}</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold d-flex align-items-center gap-2">
          {{ loadingAssigneeOptions ? 'Loading...' : 'Assignee' }}
          <span *ngIf="loadingAssigneeOptions" class="spinner-border spinner-border-sm text-primary"
            role="status"></span>
        </label>
        <select class="form-select" [(ngModel)]="selectedAssigneeId" [disabled]="!selectedAssigneeTypeId">
          <option disabled [ngValue]="null">-- Select Assignee --</option>
          <option *ngFor="let opt of assigneeOptions" [ngValue]="opt.id">
            {{ opt.name }}
          </option>
        </select>
      </div>
    </div>

    <hr class="my-4 text-secondary opacity-25" />

    <!-- ================= Submit ================= -->
    <div class="d-flex align-items-center gap-3">
      <button [disabled]="loading" class="btn btn-primary px-4 py-2 d-flex align-items-center gap-2"
        (click)="addFeature()">
        <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
        <i *ngIf="!loading" class="fas fa-check"></i>
        Add
      </button>
    </div>

    <div *ngIf="message" class="mt-3 alert alert-info d-flex align-items-center gap-2 mb-0">
      <i class="fas fa-info-circle"></i>
      {{ message }}
    </div>

    <!-- =====================================================================
         العناصر التالية موجودة فعليًا وقيمتها فعّالة (bindings/handlers زي ما
         هي بدون أي تعديل)، بس مخفية بصريًا (visibility: hidden) بناءً على
         الكود الأصلي. اتنقلت هنا لآخر الصفحة ولُفّت بحاوية بارتفاع صفر عشان
         متضربش شكل التصميم بمساحة فاضية، مع إبقاء visibility: hidden زي
         ما هي على كل عنصر أصلي.
         ===================================================================== -->
    <div style="height: 0; overflow: hidden; margin: 0; padding: 0;">

      <!-- Customer (كان معلّق أصلاً - سايبه زي ما هو) -->
      <!-- <div class="mb-3">
        <label class="form-label">Customer</label>
        <select class="form-select" [(ngModel)]="selectedCustomerId">
          <option disabled [ngValue]="null">-- Select Customer --</option>
          <option *ngFor="let c of Customers" [ngValue]="c.globalCustomerId">
            {{ c.customerName }}
          </option>
        </select>
      </div> -->

      <!-- Schedule (كان معلّق أصلاً - سايبه زي ما هو) -->
      <!-- <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Schedule Date</label>
          <input type="date" class="form-control" [(ngModel)]="scheduleDate" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Schedule Time</label>
          <input type="time" class="form-control" [(ngModel)]="scheduleTime" />
        </div>
      </div> -->

      <!-- Service -->
      <div class="mb-3" style="visibility: hidden;">
        <label class="form-label">{{ loadingServices ? 'Loading Services...' : 'Service' }}</label>
        <select class="form-select" [(ngModel)]="selectedServiceId">
          <option disabled [ngValue]="null">-- Select Service --</option>
          <option *ngFor="let one of Services" [ngValue]="one.service_id">
            {{ one.description }}
          </option>
        </select>
      </div>

      <!-- ================= Assigner ================= -->
      <h6 class="fw-bold mb-3" style="visibility: hidden;">
        <i class="fas fa-user-tag me-2"></i>
        Assigner
      </h6>
      <div class="row" style="visibility: hidden;">
        <div class="col-md-6 mb-3">
          <label class="form-label">Assigner Type</label>
          <select class="form-select" [(ngModel)]="selectedAssignerTypeId"
            (change)="onAssignerTypeChange(selectedAssignerTypeId)">
            <option disabled [ngValue]="null">-- Select Type --</option>
            <option *ngFor="let t of assignTypes" [ngValue]="t.assign_typeId">{{ t.type }}</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">
            {{ loadingAssignerOptions ? 'Loading...' : 'Assigner' }}
          </label>
          <select class="form-select" [(ngModel)]="selectedAssignerId" [disabled]="!selectedAssignerTypeId">
            <option disabled [ngValue]="null">-- Select Assigner --</option>
            <option *ngFor="let opt of assignerOptions" [ngValue]="opt.id">{{ opt.name }}</option>
          </select>
        </div>
      </div>

      <!-- Assignee Type -->
      <div class="col-md-6 mb-3" style="visibility: hidden;">
        <label class="form-label">Assignee Type</label>
        <select class="form-select" [(ngModel)]="selectedAssigneeTypeId"
          (change)="onAssigneeTypeChange(selectedAssigneeTypeId)">
          <option disabled [ngValue]="null">-- Select Type --</option>
          <option *ngFor="let t of assignTypes" [ngValue]="t.assign_typeId">{{ t.type }}</option>
        </select>
      </div>

    </div>
    <!-- ===================== نهاية العناصر المخفية ===================== -->

  </div>
</div>
