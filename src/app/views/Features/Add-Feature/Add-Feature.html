<!-- Add-Feature.html -->
<div class="card">
  <div class="card-header">
    Add Order
  </div>
  <div class="card-body">

    <!-- Notes -->
    <div class="mb-3">
      <label for="notes" class="form-label">Notes</label>
      <textarea class="form-control" id="notes" rows="4" [(ngModel)]="notes"
        placeholder="Enter order notes"></textarea>
    </div>

    <!-- Order Status -->
    <div class="mb-3">
      <label class="form-label">Status</label>
      <select class="form-select" [(ngModel)]="selectedOrderStatusId">
        <option disabled [ngValue]="null">-- Select Status --</option>
        <option *ngFor="let s of OrderStatuses" [ngValue]="s.orderStatusId">
          {{ s.statusEn }}
        </option>
      </select>
    </div>

    <!-- Business -->
    <div class="mb-3">
      <label class="form-label">Business</label>
      <select (change)="getAllServices(selectedBusinessId)" class="form-select" [(ngModel)]="selectedBusinessId">
        <option disabled [ngValue]="null">-- Select Business --</option>
        <option *ngFor="let one of Businesses" [ngValue]="one.business_id">
          {{ one.business_name }}
        </option>
      </select>
    </div>

    <!-- Service -->
    <div class="mb-3">
      <label class="form-label">{{ loadingServices ? 'Loading Services...' : 'Service' }}</label>
      <select class="form-select" [(ngModel)]="selectedServiceId">
        <option disabled [ngValue]="null">-- Select Service --</option>
        <option *ngFor="let one of Services" [ngValue]="one.service_id">
          {{ one.description }}
        </option>
      </select>
    </div>

    <!-- Customer -->
    <!-- <div class="mb-3">
      <label class="form-label">Customer</label>
      <select class="form-select" [(ngModel)]="selectedCustomerId">
        <option disabled [ngValue]="null">-- Select Customer --</option>
        <option *ngFor="let c of Customers" [ngValue]="c.globalCustomerId">
          {{ c.customerName }}
        </option>
      </select>
    </div> -->

    <!-- Schedule -->

      <div class="col-md-6 mb-3">
        <label class="form-label">Schedule Date</label>
        <input type="date" class="form-control" [(ngModel)]="scheduleDate" />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Schedule Time</label>
        <input type="time" class="form-control" [(ngModel)]="scheduleTime" />
      </div>
    </div> -->

    <hr class="my-4 " />

    <!-- ================= Assigner ================= -->
<h6 class="fw-bold mb-3">
  <i class="fas fa-user-tag me-2"></i>
  Assigner
</h6>
<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label">Assigner Type</label>
    <select class="form-select" [(ngModel)]="selectedAssignerTypeId"
      (change)="onAssignerTypeChange(selectedAssignerTypeId)">
      <option disabled [ngValue]="null">-- Select Type --</option>
      <option *ngFor="let t of assignTypes" [ngValue]="t.assign_typeId">{{ t.type }}</option>
    </select>
  </div>
  <div class="col-md-6 mb-3">
    <label class="form-label">
      {{ loadingAssignerOptions ? 'Loading...' : 'Assigner' }}
    </label>
    <select class="form-select" [(ngModel)]="selectedAssignerId" [disabled]="!selectedAssignerTypeId">
      <option disabled [ngValue]="null">-- Select Assigner --</option>
      <option *ngFor="let opt of assignerOptions" [ngValue]="opt.id">{{ opt.name }}</option>
    </select>
  </div>
</div>

<!-- ================= Assignee ================= -->
<h6 class="fw-bold mb-3 mt-2">
  <i class="fas fa-user-check me-2"></i>
  Assignee
</h6>
<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label">Assignee Type</label>
    <select class="form-select" [(ngModel)]="selectedAssigneeTypeId"
      (change)="onAssigneeTypeChange(selectedAssigneeTypeId)">
      <option disabled [ngValue]="null">-- Select Type --</option>
      <option *ngFor="let t of assignTypes" [ngValue]="t.assign_typeId">{{ t.type }}</option>
    </select>
  </div>
  <div class="col-md-6 mb-3">
    <label class="form-label">
      {{ loadingAssigneeOptions ? 'Loading...' : 'Assignee' }}
    </label>
    <select class="form-select" [(ngModel)]="selectedAssigneeId" [disabled]="!selectedAssigneeTypeId">
      <option disabled [ngValue]="null">-- Select Assignee --</option>
      <option *ngFor="let opt of assigneeOptions" [ngValue]="opt.id">{{ opt.name }}</option>
    </select>
  </div>
</div>

    <hr class="my-4" />

    <button [disabled]="loading" class="btn btn-primary" (click)="addFeature()">Add</button>
    <div *ngIf="message" class="mt-3 alert alert-info">{{ message }}</div>
  </div>
</div>
