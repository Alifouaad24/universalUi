<!-- add-business-type.component.html -->
<div class="card">
  <div class="card-header">
      {{ cause ==null ? 'Add Cause' : 'Edit Cause' }}
  </div>
  <div class="card-body">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" [(ngModel)]="name" placeholder="enter name ...">
    </div>
    <button [disabled]="loading" class="btn btn-primary" (click)="addCause()">
      {{ cause ==null ? 'Add' : 'Edit' }}
    </button>
    <div *ngIf="message" class="mt-3 alert alert-info">{{ message }}</div>
  </div>
</div>
